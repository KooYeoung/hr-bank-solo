spring:
  application:
    name: hr-bank
  datasource:
    url: jdbc:postgresql://localhost:5432/hrbank
    username: hrbank
    password: hrbank1234

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

hrbank:
  employee-number:
    sequence-width: 4
  file-directory: ./storage
  backup:
    schedule:
      enabled: true
      fixed-delay-ms : 3600000


